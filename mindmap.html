<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Карта курса Python — визуальная схема всех тем и их взаимосвязей." />
  <title>🐍 Python — Карта курса (Mind Map)</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    body { background: #f0f2f5; font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
    [data-theme="dark"] body { background: #1a1a2e; }
    .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
    header {
      text-align: center; padding: 36px 30px; background: var(--card-bg);
      border-radius: 16px; margin-bottom: 28px; box-shadow: var(--shadow);
    }
    header h1 { font-size: 2em; color: var(--text); margin-bottom: 6px; }
    header h1 span { color: var(--primary); }
    header p { color: var(--text-muted); font-size: 1em; }
    .back-link { display: inline-block; margin-bottom: 16px; color: var(--primary); text-decoration: none; font-weight: 600; }
    .back-link:hover { text-decoration: underline; }
    .mm-stage {
      background: var(--card-bg); border-radius: 16px; padding: 24px 28px;
      margin-bottom: 20px; box-shadow: var(--shadow);
    }
    .mm-stage h2 {
      font-size: 1.2em; color: var(--primary); margin: 0 0 16px;
      padding-bottom: 8px; border-bottom: 2px solid var(--border);
    }
    .mm-row {
      display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px;
    }
    .mm-node {
      display: block; text-decoration: none; background: var(--bg-alt);
      border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px;
      transition: all 0.2s; min-width: 140px; text-align: center;
    }
    .mm-node:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow); }
    .mm-node .num {
      display: inline-block; background: var(--primary-gradient); color: #fff;
      border-radius: 50%; width: 32px; height: 32px; line-height: 32px;
      font-size: 0.85em; font-weight: bold; margin-bottom: 6px;
    }
    .mm-node .title { font-weight: 600; color: var(--text); font-size: 0.92em; margin: 4px 0 2px; }
    .mm-node .desc { font-size: 0.78em; color: var(--text-muted); }
    .mm-arrow {
      display: flex; align-items: center; font-size: 1.4em; color: var(--primary);
      min-width: 24px; justify-content: center; padding-top: 14px;
    }
    @media (max-width: 700px) {
      .mm-arrow { display: none; }
      .mm-row { flex-direction: column; }
      .mm-node { min-width: auto; }
    }
  </style>
</head>
<body>
<div class="container">
  <a href="index.html" class="back-link">← На главную</a>
  <header>
    <h1>🗺️ <span>Карта курса</span> Python</h1>
    <p>Визуальная схема всех 50 тем и их взаимосвязей. Стрелки показывают порядок изучения «от простого к сложному».</p>
  </header>

  <!-- Динамический контейнер для mindmap — заполняется из lessons.json -->
  <div id="mm-container">
    <p style="text-align:center;color:var(--text-muted);padding:40px;">⏳ Загрузка карты курса...</p>
  </div>

  <footer style="text-align:center; color:var(--text-muted); padding:24px; font-size:0.9em;">
    🗺️ Python Web — Карта курса. Навигация по темам от простого к сложному.
  </footer>
</div>
<script>
<!-- Динамическая загрузка карты курса из lessons.json -->
(function () {
  var container = document.getElementById('mm-container');
  if (!container) return;

  var stageEmoji = [
    '📖', '📚', '🔀', '🔁', '🔤', '🔄', '⚙️', '🗂️', 'λ', '💾', '🧰', '🏗️', '🚀', '🌐'
  ];

  fetch('lessons.json')
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (data) {
      var sections = data.sections;
      if (!sections || !sections.length) throw new Error('No sections');

      var html = '';
      sections.forEach(function (section, si) {
        var emoji = stageEmoji[si] || '📖';
        var lessons = section.lessons;
        if (!lessons || !lessons.length) return;

        // Заголовок этапа
        var firstNum = lessons[0].num;
        var lastNum = lessons[lessons.length - 1].num;
        var range = (firstNum === lastNum) ? ('урок ' + firstNum) : ('уроки ' + firstNum + '–' + lastNum);
        html += '<div class="mm-stage">';
        html += '  <h2>' + emoji + ' ' + section.title + ' (' + range + ')</h2>';

        // Разбиваем уроки по строкам: max 3 в строке
        var chunkSize = 3;
        for (var i = 0; i < lessons.length; i += chunkSize) {
          var chunk = lessons.slice(i, i + chunkSize);
          html += '  <div class="mm-row"' + (i > 0 ? ' style="margin-top:12px;"' : '') + '>';
          for (var j = 0; j < chunk.length; j++) {
            var lesson = chunk[j];
            if (j > 0) {
              html += '    <span class="mm-arrow">→</span>';
            }
            html += '    <a href="' + lesson.file + '" class="mm-node">';
            html += '      <span class="num">' + lesson.num + '</span>';
            html += '      <div class="title">' + lesson.title + '</div>';
            html += '      <div class="desc">' + (lesson.desc || '') + '</div>';
            html += '    </a>';
          }
          html += '  </div>';
        }

        html += '</div>';
      });

      // Финальная секция
      html += '<div class="mm-stage">';
      html += '  <h2>🏁 Финальный этап</h2>';
      html += '  <div class="mm-row">';
      html += '    <a href="final-test.html" class="mm-node">';
      html += '      <span class="num" style="background:linear-gradient(135deg,#f59e0b,#d97706);">🏆</span>';
      html += '      <div class="title">Итоговый тест</div><div class="desc">Проверка знаний</div>';
      html += '    </a>';
      html += '    <span class="mm-arrow">→</span>';
      html += '    <a href="cheatsheets.html" class="mm-node">';
      html += '      <span class="num" style="background:linear-gradient(135deg,#10b981,#059669);">📋</span>';
      html += '      <div class="title">Шпаргалки</div><div class="desc">Краткие конспекты</div>';
      html += '    </a>';
      html += '  </div>';
      html += '</div>';

      container.innerHTML = html;
    })
    .catch(function (err) {
      container.innerHTML = '<p style="text-align:center;color:red;padding:40px;">⚠️ Не удалось загрузить карту курса: ' + err.message + '</p>';
    });
})();
</script>
</body>
</html>
