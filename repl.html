<!doctype html>
<html lang="ru" data-lesson="repl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' cdnjs.cloudflare.com www.googletagmanager.com; style-src 'self' 'unsafe-inline' cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self' https://www.google-analytics.com; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="description" content="Интерактивная Python-консоль — пиши код и сразу видь результат." />
    <title>🐍 Python REPL — Интерактивная консоль</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/vs2015.min.css" id="hljs-theme" integrity="sha384-BE+nmfgoK1j3fBxbLI64Jzf52Mx/QAyw+4O7GyPYevJnAyrljCoRtQkYNfCfuWPF" crossorigin="anonymous" />
  </head>
  <body class="repl-page">
    <script src="script.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js" integrity="sha384-RH2xi4eIQ/gjtbs9fUXM68sLSi99C7ZWBRX1vDrVv6GQXRibxXLbwO2NGZB74MbU" crossorigin="anonymous" ></script>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Q5ZWEHXWYF"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-Q5ZWEHXWYF');
    </script>

    <div class="container repl-container">
      <div class="repl-header">
        <h1>🐍 Python REPL</h1>
        <p>Интерактивная консоль — вводи Python-код и сразу смотри результат</p>
        <a class="back-link" href="index.html">← На главную</a>
      </div>

      <div class="repl-panel" id="repl-panel">
        <div class="repl-toolbar">
          <div class="repl-tabs">
            <button data-tab="repl" class="active">🐍 REPL</button>
            <button data-tab="editor">📝 Многострочный редактор</button>
          </div>
          <span class="repl-tab-count" id="history-count">0 команд</span>
          <button onclick="clearHistory()">🗑 Очистить</button>
        </div>

        <!-- Панель REPL -->
        <div id="tab-repl">
          <div class="repl-history" id="repl-history">
            <div style="color: var(--text-muted); text-align: center; padding: 0 30px;">🐍 Введи Python-код ниже и нажми <strong>▶ Выполнить</strong></div>
          </div>
          <div class="repl-snippets" id="repl-snippets"></div>
          <div class="repl-input-area">
            <textarea id="repl-input" rows="3" placeholder="print('Привет, мир!')" autofocus></textarea>
            <div class="repl-stdin-row">
              <label for="repl-stdin" class="repl-stdin-label">📥 input():</label>
              <textarea id="repl-stdin" placeholder="Ввод для input() — каждое значение на новой строке"></textarea>
              <button id="repl-run-btn" class="repl-run-btn" onclick="runRepl()">▶ Выполнить</button>
            </div>
          </div>
          <div class="repl-multiline-hint">
            <strong>Enter</strong> — выполнить код &nbsp;|&nbsp; <strong>Shift+Enter</strong> — новая строка
          </div>
        </div>

        <!-- Панель многострочного редактора -->
        <div id="tab-editor" style="display: none;">
          <div class="repl-input-area">
            <textarea id="editor-input" rows="10" placeholder="print('Hello')\nfor i in range(5):\n    print(i)" style="font-size: 0.92em;"></textarea>
            <div class="repl-stdin-row">
              <label for="editor-stdin" class="repl-stdin-label">📥 input():</label>
              <textarea id="editor-stdin" placeholder="Ввод для input() — каждое значение на новой строке"></textarea>
              <button id="editor-run-btn" class="repl-run-btn" onclick="runEditor()">▶ Выполнить</button>
            </div>
          </div>
          <div id="editor-output" style="padding: 12px 16px; font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 0.92em; min-height: 48px; background: var(--bg-alt); border-top: 1px solid var(--border);"></div>
          <div class="repl-multiline-hint">
            <strong>Ctrl+Enter</strong> — выполнить код
          </div>
        </div>
      </div>
    </div>

    <script>
      // REPL — глобальный скоуп для обратной совместимости с inline-обработчиками onclick
      const sessionId = 'sess_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);

      let history = [];
      try {
        const saved = localStorage.getItem('python-repl-history');
        if (saved) {
          history = JSON.parse(saved);
        }
      } catch(e) {}

      let currentTab = 'repl';

      function renderSnippets() {
        const snippets = [
          { label: 'print()', code: 'print("Привет, мир!")' },
          { label: 'range()', code: 'for i in range(5):\n    print(i, end=" ")' },
          { label: 'sorted()', code: 'numbers = [3, 1, 4, 1, 5, 9]\nprint(sorted(numbers))\nprint(sorted(numbers, reverse=True))' },
          { label: 'lambda', code: 'square = lambda x: x**2\nprint(square(7))' },
          { label: 'list comp', code: 'squares = [x**2 for x in range(10)]\nprint(squares)' },
          { label: 'dict', code: 'd = {"a": 1, "b": 2}\nfor k, v in d.items():\n    print(k, "→", v)' },
          { label: 'zip', code: 'names = ["Аня", "Боря"]\nages = [16, 17]\nfor n, a in zip(names, ages):\n    print(f"{n} — {a}")' }
        ];
        const container = document.getElementById('repl-snippets');
        let html = '';
        snippets.forEach(function(s) {
          html += '<button class="repl-snippet" onclick="document.getElementById(\'repl-input\').value = \'' + s.code.replace(/'/g, "\\'").replace(/\n/g, '\\n') + '\'; document.getElementById(\'repl-input\').focus();">' + s.label + '</button>';
        });
        container.innerHTML = html;
      }

      document.querySelectorAll('.repl-toolbar button[data-tab]').forEach(function(b) {
        b.addEventListener('click', function() {
          switchTab(b.dataset.tab);
        });
      });

      function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tab-repl').style.display = tab === 'repl' ? '' : 'none';
        document.getElementById('tab-editor').style.display = tab === 'editor' ? '' : 'none';
        document.querySelectorAll('.repl-toolbar button[data-tab]').forEach(function(b) {
          b.classList.toggle('active', b.dataset.tab === tab);
        });
      }

      async function runRepl() {
        const input = document.getElementById('repl-input');
        const code = input.value.trim();
        if (!code) return;

        // === U6: ИНДИКАТОР ВЫПОЛНЕНИЯ (СПИННЕР) ===
        const btn = document.getElementById('repl-run-btn');
        btn.disabled = true;
        btn.classList.add('running');
        btn.textContent = '⏳ Выполняется...';

        const entry = { code: code, output: '', error: '', time: Date.now() };

        try {
          const stdinEl = document.getElementById('repl-stdin');
          const stdin = stdinEl ? stdinEl.value : '';
          const response = await fetch('sandbox/repl.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: code, input: stdin, timeout: 5, session_id: sessionId })
          });

          if (!response.ok) {
            let errMsg = 'HTTP ' + response.status;
            try {
              const errBody = await response.json();
              if (errBody && errBody.error) errMsg = errBody.error;
            } catch(_) {}
            throw new Error(errMsg);
          }

          const result = await response.json();
          entry.output = result.stdout || '';
          entry.error = result.stderr || '';

          if (!entry.output && !entry.error && result.ok) {
            entry.output = '✅ Выполнено (нет вывода)';
          }
        } catch(err) {
          entry.error = err.message;
        } finally {
          // Сброс спиннера
          btn.disabled = false;
          btn.classList.remove('running');
          btn.textContent = '▶ Выполнить';
        }

        history.push(entry);
        if (history.length > 100) history.shift();

        try {
          localStorage.setItem('python-repl-history', JSON.stringify(history.slice(-50)));
        } catch(e) {}

        renderHistory();
        input.value = '';
        input.focus();
      }

      function renderHistory() {
        const container = document.getElementById('repl-history');
        const countEl = document.getElementById('history-count');
        countEl.textContent = history.length + ' команд';

        if (history.length === 0) {
          container.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 0 30px;">🐍 Введи Python-код ниже и нажми <strong>▶ Выполнить</strong></div>';
          return;
        }

        container.innerHTML = history.map(function(entry) {
          const prompt = '>>>';
          let html = '<div class="repl-entry">';
          html += '<div class="repl-input-line"><span class="repl-prompt">' + prompt + '</span>' + escapeHtml(entry.code) + '</div>';
          if (entry.output) {
            html += '<div class="repl-output">' + escapeHtml(entry.output) + '</div>';
          }
          if (entry.error) {
            html += '<div class="repl-error">⚠️ ' + escapeHtml(entry.error) + '</div>';
          }
          html += '</div>';
          return html;
        }).join('');

        container.scrollTop = container.scrollHeight;
      }

      function clearHistory() {
        history = [];
        localStorage.removeItem('python-repl-history');
        renderHistory();
        fetch('sandbox/repl.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: '', reset: true, session_id: sessionId })
        }).catch(function(){});
      }

      async function runEditor() {
        const input = document.getElementById('editor-input');
        const output = document.getElementById('editor-output');
        const code = input.value.trim();
        if (!code) return;

        // === U6: ИНДИКАТОР ВЫПОЛНЕНИЯ (СПИННЕР) ===
        const btn = document.getElementById('editor-run-btn');
        if (btn) {
          btn.classList.add('running');
          btn.textContent = '⏳ Выполняется...';
        }

        output.innerHTML = '⏳ Выполнение...';
        output.style.color = 'var(--text-muted)';

        try {
          const stdinEl = document.getElementById('editor-stdin');
          const stdin = stdinEl ? stdinEl.value : '';
          const response = await fetch('sandbox/repl.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: code, input: stdin, timeout: 10, session_id: sessionId })
          });

          if (!response.ok) {
            let errMsg = 'HTTP ' + response.status;
            try {
              const errBody = await response.json();
              if (errBody && errBody.error) errMsg = errBody.error;
            } catch(_) {}
            throw new Error(errMsg);
          }

          const result = await response.json();

          let html = '';
          if (result.stdout) {
            html += '<div style="color: var(--text);">' + escapeHtml(result.stdout) + '</div>';
          }
          if (result.stderr) {
            html += '<div style="color: #ef4444;">⚠️ ' + escapeHtml(result.stderr) + '</div>';
          }
          if (!result.stdout && !result.stderr && result.ok) {
            html = '<div style="color: #10b981;">✅ Код выполнен без вывода</div>';
          }
          output.innerHTML = html;
        } catch(err) {
          output.innerHTML = '<span style="color: #ef4444;">⚠️ ' + escapeHtml(err.message) + '</span>';
        } finally {
          // Сброс спиннера
          if (btn) {
            btn.classList.remove('running');
            btn.textContent = '▶ Выполнить';
          }
        }
      }

      document.addEventListener('DOMContentLoaded', function() {
        renderSnippets();

        document.getElementById('repl-input').addEventListener('keydown', function(e) {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            runRepl();
          }
        });

        document.getElementById('editor-input').addEventListener('keydown', function(e) {
          if (e.key === 'Enter' && e.ctrlKey) {
            e.preventDefault();
            runEditor();
          }
        });
      });

      // escapeHtml определена глобально в script.js → window.escapeHtml
      // При закрытии/перезагрузке страницы — очищаем серверную сессию
      window.addEventListener('beforeunload', function() {
        const data = JSON.stringify({
          code: '',
          reset: true,
          session_id: sessionId
        });
        navigator.sendBeacon('sandbox/repl.php', new Blob([data], { type: 'application/json' }));
      });
    </script>
  </body>
</html>
