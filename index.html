<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Изучайте Python с нуля — 50 интерактивных уроков с примерами кода, подсветкой синтаксиса и отслеживанием прогресса." />
    <meta property="og:title" content="Python — Основы программирования" />
    <meta property="og:description" content="50 уроков по Python для начинающих: от переменных до Git. Бесплатно, с примерами кода." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://python.nayanovaacademy.ru/" />
    <meta property="og:image" content="https://python.nayanovaacademy.ru/favicon.png" />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Python — Основы программирования" />
    <meta name="twitter:description" content="50 уроков по Python для начинающих: от переменных до Git. Бесплатно, с примерами кода." />
    <meta name="twitter:image" content="https://python.nayanovaacademy.ru/favicon.png" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://python.nayanovaacademy.ru/" />
    <title>Основы программирования на Python — 50 уроков для начинающих</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon.png" />
    <meta name="theme-color" content="#667eea" />
    <link rel="manifest" href="manifest.json" />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/vs2015.min.css" id="hljs-theme" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Course",
      "name": "Python — Основы программирования",
      "description": "Изучайте Python с нуля — 50 интерактивных уроков с примерами кода, подсветкой синтаксиса и отслеживанием прогресса.",
      "provider": { "@type": "Organization", "name": "Python Web" },
      "educationalLevel": "beginner",
      "numberOfLessons": "50",
      "inLanguage": "ru",
      "hasCourseInstance": { "@type": "CourseInstance", "courseMode": ["online", "MOOC"], "inLanguage": "ru" }
    }
    </script>
    <style>
      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
      }
      [data-theme="dark"] body {
        background: linear-gradient(135deg, #1a1030 0%, #0f0a20 100%);
      }
      .container {
        max-width: 1040px;
        margin: 0 auto;
        padding: 40px 20px;
      }
      header {
        text-align: center;
        padding: 50px 30px 36px;
        background: var(--card-bg);
        border-radius: var(--radius);
        margin-bottom: 32px;
        box-shadow: var(--shadow-lg);
        transition: background var(--transition), box-shadow var(--transition);
      }
      header h1 {
        font-size: 2.4em;
        color: var(--text);
        margin-bottom: 8px;
        transition: color var(--transition);
      }
      header h1 span {
        color: var(--primary);
      }
      header p {
        color: var(--text-muted);
        font-size: 1.08em;
        transition: color var(--transition);
      }
      .repl-hero-btn {
        display: inline-block;
        margin-top: 16px;
        padding: 10px 24px;
        background: var(--primary-gradient);
        color: #fff;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95em;
        transition: all var(--transition);
        box-shadow: var(--shadow);
      }
      .repl-hero-btn:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-lg);
        filter: brightness(1.1);
      }
      nav {
        display: flex;
        flex-direction: column;
        gap: 28px;
      }
      .section-group {
        background: var(--card-bg);
        border-radius: var(--radius);
        padding: 20px 24px 16px;
        box-shadow: var(--shadow);
        transition: background var(--transition);
        border: 1px solid transparent;
      }
      .section-title {
        font-size: 1.15em;
        color: var(--primary);
        margin: 0 0 14px 4px;
        padding-bottom: 10px;
        border-bottom: 2px solid var(--border);
        transition: color var(--transition), border-color var(--transition);
      }
      .section-cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
        gap: 12px;
      }
      .topic-card {
        background: var(--bg-alt);
        border-radius: 12px;
        padding: 18px 22px;
        text-decoration: none;
        color: var(--text);
        transition: all var(--transition);
        box-shadow: var(--shadow-sm);
        display: flex;
        align-items: center;
        gap: 13px;
        border: 1px solid var(--border);
        position: relative;
      }
      .topic-card:hover {
        transform: translateY(-3px);
        box-shadow: var(--shadow-lg);
        background: var(--card-hover-bg);
        border-color: var(--primary);
      }
      .topic-num {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 1.05em;
        flex-shrink: 0;
        transition: all var(--transition);
      }
      .topic-card.completed .topic-num,
      .topic-num.completed-num {
        background: linear-gradient(135deg, #10b981, #059669);
      }
      .topic-card.completed {
        border-left: 4px solid #10b981;
      }
      .topic-info h2 {
        font-size: 1.02em;
        margin-bottom: 3px;
        color: var(--text);
        transition: color var(--transition);
      }
      .topic-info p {
        font-size: 0.83em;
        color: var(--text-muted);
        transition: color var(--transition);
      }
      footer {
        text-align: center;
        color: rgba(255, 255, 255, 0.7);
        margin-top: 40px;
        padding: 20px;
        font-size: 0.9em;
      }
      .progress-bar-container {
        max-width: 400px;
        margin: 14px auto 6px;
      }
      .progress-info {
        display: block;
        text-align: center;
        margin-top: 4px;
      }
      .search-container {
        margin-bottom: 24px;
      }
      @media (max-width: 480px) {
        header h1 { font-size: 1.5em; }
        .section-cards { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>🐍 <span>Python</span> — основы программирования</h1>
        <p>50 тем для начинающих с примерами кода</p>
        <div class="progress-bar-container"></div>
        <span class="progress-info"></span>
        <a href="repl.html" class="repl-hero-btn">▶ Интерактивная консоль Python</a>
        <!-- Блок достижений (badges) -->
        <div class="badges-section" id="badgesBlock" style="display:none;">
          <div class="badges-title">🏆 Достижения</div>
          <div class="badges-grid" id="badgesGrid"></div>
        </div>
      </header>

      <nav>
        <!-- Навигация генерируется динамически из lessons.json -->
      </nav>
      <footer>
        Создано для изучения основ Python. Все примеры можно запустить в интерпретаторе.
      </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
