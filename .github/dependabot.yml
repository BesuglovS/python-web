version: 2
updates:
  # npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
    open-pull-requests-limit: 10
    reviewers:
      - 'BesuglovS'
    assignees:
      - 'BesuglovS'
    commit-message:
      prefix: 'chore(deps): '
      include: 'scope'
    labels:
      - 'dependencies'
      - 'npm'
    allow:
      - dependency-type: 'direct'
      - dependency-type: 'indirect'
    ignore:
      - dependency-name: 'esbuild'
        versions: ['0.25.x'] # wait for 0.26+
    groups:
      dev-dependencies:
        patterns:
          - '@types/*'
          - 'eslint*'
          - 'prettier*'
          - 'vitest*'
          - '@vitest/*'
          - '@playwright/*'
          - 'lint-staged'
          - 'husky'
        update-types:
          - 'minor'
          - 'patch'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
    open-pull-requests-limit: 5
    reviewers:
      - 'BesuglovS'
    assignees:
      - 'BesuglovS'
    commit-message:
      prefix: 'ci(deps): '
      include: 'scope'
    labels:
      - 'dependencies'
      - 'github-actions'
